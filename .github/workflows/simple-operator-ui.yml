name: Simple Operator UI Regression

on:
  push:
    branches:
      - feature/smite-simple-operator-ui-20261018
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/simple-operator-ui.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck complete frontend
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test inbound validation and basic/advanced UI contract
        working-directory: frontend
        run: |
          ./node_modules/.bin/esbuild src/utils/inboundPorts.ts --bundle --format=cjs --platform=node --outfile=tests/inboundPorts.generated.cjs
          node --test tests/inboundPorts.test.cjs
      - name: Test immutable shared FRPS child edit form
        working-directory: frontend
        run: |
          ./node_modules/.bin/esbuild src/utils/frpSharedChildEdit.ts --bundle --format=cjs --platform=node --outfile=tests/frpSharedChildEdit.generated.cjs
          node --test tests/frpSharedChildEdit.test.cjs
      - name: Verify optional login code and MFA session handling
        working-directory: frontend
        run: |
          ./node_modules/.bin/esbuild src/api/client.ts --bundle --format=cjs --platform=node --outfile=tests/mfaClient.generated.cjs
          node --test tests/mfaSecurity.test.cjs
      - name: Test compact responsive sidebar layout
        working-directory: frontend
        run: node --test tests/sidebarLayout.test.cjs
      - name: Verify charcoal-teal theme only reuses existing product capabilities
        working-directory: frontend
        run: node --test tests/charcoalThemeContract.test.cjs
      - name: Reject incomplete dashboard data and stale setup progress
        working-directory: frontend
        run: |
          ./node_modules/.bin/esbuild src/utils/dashboardData.ts --bundle --format=cjs --platform=node --outfile=tests/dashboardData.generated.cjs
          node --test tests/dashboardData.test.cjs
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
      - name: Browser layout, login and responsive UI regression (fixture APIs only)
        working-directory: frontend
        run: |
          npm install --prefix /tmp/smite-ui-browser --no-audit --no-fund playwright@1.51.1
          /tmp/smite-ui-browser/node_modules/.bin/playwright install --with-deps chromium
          npm run preview -- --host 127.0.0.1 --port 3100 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID"' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:3100/ >/dev/null && break; sleep 1; done
          PLAYWRIGHT_MODULE=/tmp/smite-ui-browser/node_modules/playwright node tests/compact-browser.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: compact-ui-browser-evidence
          path: frontend/compact-evidence/
      - name: Package reviewed UI-only static assets (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_UI_PACKAGE'
          import hashlib, json, os, pathlib, tarfile

          dist = pathlib.Path('frontend/dist')
          if not (dist / 'index.html').is_file() or not (dist / 'assets').is_dir():
              raise SystemExit('HOLD: compiled UI assets are missing')
          files = sorted(p for p in dist.rglob('*') if p.is_file())
          if any(p.is_symlink() for p in dist.rglob('*')):
              raise SystemExit('HOLD: symlinks in compiled UI are not permitted')
          if not files:
              raise SystemExit('HOLD: no compiled UI assets')
          output = pathlib.Path('ui-only-artifact')
          output.mkdir(exist_ok=True)
          manifest = {
              'kind': 'smite-rc7-static-ui-only-preview',
              'source_sha': os.environ['GITHUB_SHA'],
              'base_runtime': 'smite-panel v2.0.0-rc.7; backend/node images unchanged',
              'activation_allowed': False,
              'files': [
                  {'path': str(p.relative_to(dist)), 'sha256': hashlib.sha256(p.read_bytes()).hexdigest(), 'bytes': p.stat().st_size}
                  for p in files
              ],
          }
          manifest_path = output / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          name = 'smite-rc7-ui-only-' + os.environ['GITHUB_SHA'][:12] + '.tar.gz'
          archive = output / name
          with tarfile.open(archive, 'w:gz') as tar:
              for f in files:
                  tar.add(f, arcname='static/' + f.relative_to(dist).as_posix(), recursive=False)
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (output / 'SHA256SUMS').write_text(digest + '  ' + name + '\n')
          print('UI_ONLY_ARTIFACT=' + name)
          print('UI_ONLY_SHA256=' + digest)
          print('UI_ONLY_FILE_COUNT=' + str(len(files)))
          print('UI_ONLY_DEPLOYED=NO')
          PY_UI_PACKAGE
      - name: Upload UI-only preview payload (download-only)
        uses: actions/upload-artifact@v4
        with:
          name: smite-rc7-ui-only-static-preview
          path: ui-only-artifact/
          if-no-files-found: error
          retention-days: 7
