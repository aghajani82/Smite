name: Simple Operator UI Regression

on:
  push:
    branches:
      - feature/smite-simple-operator-ui-20261018
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/simple-operator-ui.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck complete frontend
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Test inbound validation and basic/advanced UI contract
        working-directory: frontend
        run: |
          ./node_modules/.bin/esbuild src/utils/inboundPorts.ts --bundle --format=cjs --platform=node --outfile=tests/inboundPorts.generated.cjs
          node --test tests/inboundPorts.test.cjs
      - name: Verify optional login code and MFA session handling
        working-directory: frontend
        run: |
          ./node_modules/.bin/esbuild src/api/client.ts --bundle --format=cjs --platform=node --outfile=tests/mfaClient.generated.cjs
          node --test tests/mfaSecurity.test.cjs
      - name: Production frontend build
        working-directory: frontend
        run: npm run build
