name: Signed Agent Commands (Strict Mode Preview)

on:
  push:
    branches:
      - feature/node-agent-signed-commands-20261018
  pull_request:
    paths:
      - 'node/app/agent_auth.py'
      - 'node/app/replay_enrollment.py'
      - 'node/app/replay_restore_hold.py'
      - 'tests/test_replay_restore_quarantine.py'
      - 'tests/test_replay_enrollment_offline.py'
      - 'node/app/config.py'
      - 'node/app/engine_inventory.py'
      - 'panel/app/node_client.py'
      - 'panel/app/config.py'
      - 'panel/app/routers/tunnels.py'
      - 'panel/app/xhttp_route_lifecycle.py'
      - 'tests/test_panel_xhttp_route_lifecycle.py'
      - 'frontend/src/pages/Tunnels.tsx'
      - 'node/app/routers/agent.py'
      - 'node/app/uopti_route_broker_client.py'
      - 'node/app/sanaei_inbound_inventory.py'
      - 'node/docker-compose.yml'
      - 'tests/test_sanaei_inbound_inventory.py'
      - 'panel/app/agent_request_signer.py'
      - 'tests/test_node_agent_signed_commands.py'
      - 'tests/test_uopti_route_broker_client.py'
      - '.github/workflows/node-agent-signed-commands.yml'

permissions:
  contents: read

jobs:
  strict-agent-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact runtime dependencies
        run: |
          python -m pip install \
            'fastapi==0.104.1' 'httpx==0.25.2' \
            'pydantic==2.5.0' 'pydantic-settings==2.1.0' \
            'cryptography==41.0.7' 'sqlalchemy==2.0.23' 'aiosqlite==0.19.0'
      - name: Python syntax
        run: |
          python -m py_compile \
            node/app/agent_auth.py node/app/config.py node/app/engine_inventory.py \
            node/app/routers/agent.py node/app/sanaei_inbound_inventory.py \
            node/app/uopti_route_broker_client.py \
            panel/app/agent_request_signer.py \
            panel/app/config.py panel/app/routers/tunnels.py \
            panel/app/xhttp_route_lifecycle.py \
            tests/test_node_agent_signed_commands.py tests/test_sanaei_inbound_inventory.py \
            tests/test_panel_xhttp_route_lifecycle.py \
            tests/test_uopti_route_broker_client.py \
            node/app/replay_enrollment.py tests/test_replay_enrollment_offline.py \
            node/app/replay_restore_hold.py tests/test_replay_restore_quarantine.py
      - name: Agent runtime auth, replay persistence and cross-role signing tests
        run: |
          python -B tests/test_node_agent_signed_commands.py -v
          python -B tests/test_sanaei_inbound_inventory.py -v
          python -B tests/test_panel_xhttp_route_lifecycle.py -v
          PYTHONPATH=node python -B tests/test_uopti_route_broker_client.py -v
          python -B tests/test_replay_enrollment_offline.py -v
          python -B tests/test_replay_restore_quarantine.py -v
      - name: Legacy auth remains default
        run: |
          grep -Fq 'smite_agent_auth_mode: Literal["legacy", "strict"] = "legacy"' node/app/config.py
          grep -Fq 'dependencies=[Depends(require_agent_auth)]' node/app/routers/agent.py
