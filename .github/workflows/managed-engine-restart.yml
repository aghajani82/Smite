name: Managed Engine Restart Admission

on:
  push:
    branches:
      - feature/smite-simple-operator-ui-20261018
  pull_request:
    paths:
      - 'node/app/core_adapters.py'
      - 'node/app/engine_inventory.py'
      - 'tests/test_managed_engine_restart.py'
      - '.github/workflows/managed-engine-restart.yml'

permissions:
  contents: read

jobs:
  managed-engine-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal runtime dependencies
        run: |
          python -m pip install 'psutil==7.1.0' 'pydantic==2.5.0' 'pydantic-settings==2.1.0'
      - name: Verify restart and direct Apply deny absent engine before side effects
        run: |
          python -m py_compile node/app/core_adapters.py tests/test_managed_engine_restart.py
          python -B tests/test_managed_engine_restart.py -v
