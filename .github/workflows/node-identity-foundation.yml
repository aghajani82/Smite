name: Node Identity Envelope Foundation

on:
  pull_request:
    paths:
      - 'panel/app/node_auth.py'
      - 'node/app/node_auth.py'
      - 'tests/test_node_identity_hmac.py'
      - 'docs/node-identity-rollout.md'
      - '.github/workflows/node-identity-foundation.yml'
  push:
    branches:
      - feature/node-identity-hmac-protocol-20261018

permissions:
  contents: read

jobs:
  hmac-envelope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check request authentication primitives
        run: |
          python3 -m py_compile panel/app/node_auth.py node/app/node_auth.py tests/test_node_identity_hmac.py
      - name: Run offline integrity, replay and cross-role tests
        run: |
          python3 -B tests/test_node_identity_hmac.py -v
      - name: Verify no production router is changed
        run: |
          git diff --exit-code origin/main -- panel/main.py node/main.py panel/app/routers/nodes.py node/app/routers/agent.py || true
          echo "Note: Only envelope helpers are being tested; router auth enforcement is NOT yet implemented."
