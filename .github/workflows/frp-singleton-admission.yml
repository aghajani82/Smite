name: Smite RC2 FRPS Singleton Admission (offline)

on:
  pull_request:
    paths:
      - 'panel/app/frp_shared_server.py'
      - 'panel/app/frp_server_admission.py'
      - 'panel/app/routers/tunnels.py'
      - 'node/app/frp_singleton_guard.py'
      - 'node/app/frp_owner_status.py'
      - 'node/app/routers/agent.py'
      - 'panel/app/node_client.py'
      - 'node/app/core_adapters.py'
      - 'tests/test_frp_shared_server_planner.py'
      - 'tests/test_frp_singleton_guard.py'
      - 'tests/test_frp_exclusive_server_admission.py'
      - 'tests/test_frp_owner_status.py'
      - '.github/workflows/frp-singleton-admission.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-frps-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Minimal offline socket fixture dependency
        run: python -m pip install 'psutil==7.1.0'
      - name: Compile both managed FRP admission boundaries
        run: |
          python -m py_compile panel/app/frp_shared_server.py panel/app/frp_server_admission.py panel/app/routers/tunnels.py panel/app/node_client.py node/app/frp_singleton_guard.py node/app/frp_owner_status.py node/app/routers/agent.py node/app/core_adapters.py
          python -m py_compile tests/test_frp_shared_server_planner.py tests/test_frp_singleton_guard.py tests/test_frp_exclusive_server_admission.py tests/test_frp_owner_status.py
      - name: Reject duplicate FRPS owner or unsafe remote proxy
        run: |
          python -B tests/test_frp_shared_server_planner.py -v
          python -B tests/test_frp_exclusive_server_admission.py -v
          python -B tests/test_frp_singleton_guard.py -v
          python -B tests/test_frp_owner_status.py -v
      - name: Confirm nothing deployed
        run: |
          echo 'FRPS_RUNTIME=NOT_STARTED'
          echo 'SIGNED_AGENT_COMMANDS=NOT_SENT'
          echo 'SERVER_CONFIG_CHANGES=NONE'
          echo 'LAB_TUNNELS=UNTOUCHED'
