name: FRP configuration privacy
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frp-log-privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -B tests/test_frp_server_log_privacy.py -v
