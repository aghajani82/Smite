name: Stage15 Independent Approval UI (isolated)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage15-ui-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Compile unconfigured frontend (no approval endpoint enabled)
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npx tsc --noEmit -p tsconfig.json
          npm run build
      - name: Check opt-in isolation and no Web Root credentials in Panel
        run: |
          set -euo pipefail
          grep -q 'VITE_STAGE15_APPROVAL_ORIGIN' frontend/src/pages/Tunnels.tsx
          grep -q 'event.origin !== routeApprovalOrigin' frontend/src/pages/Tunnels.tsx
          grep -q "ROOT_OPERATOR_GRANT_REQUIRED" frontend/src/pages/Tunnels.tsx
          ! grep -q 'APPROVE <SHA256>' frontend/src/pages/Tunnels.tsx

  node-attestation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install 'cryptography==46.0.4'
      - run: |
          python3 -m py_compile node/app/approval_attestation.py node/app/approval_runtime_evidence.py node/app/routers/agent.py
          python3 -B tests/test_approval_attestation.py -v
          python3 -B tests/test_approval_runtime_evidence.py -v
