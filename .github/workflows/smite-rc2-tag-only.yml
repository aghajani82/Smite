name: Smite RC2 Tag Only (Owner-Approved)

on:
  pull_request:
    paths:
      - '.github/workflows/smite-rc2-tag-only.yml'
      - 'tests/test_smite_rc2_tag_only.py'
      - 'tests/test_smite_rc5_lab_tag_only.py'
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: 'Exact reviewed Smite commit SHA; main releases remain merge-only'
        type: string
        required: true
      confirm_tag_only:
        description: 'Create tag only: no images, no GitHub Release, no deployment'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

jobs:
  offline-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Review one-purpose fail-closed RC2 tag contract
        run: python3 -B tests/test_smite_rc2_tag_only.py -v
      - name: Verify owner-only RC4 tag gate before mutation
        run: python3 -B tests/test_smite_rc4_lab_tag_only.py -v
      - name: Verify exact owner-only RC5 tag gate before mutation
        run: python3 -B tests/test_smite_rc5_lab_tag_only.py -v

  tag-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: offline-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: true
      - name: Create ONLY reviewed immutable candidate tag
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          CONFIRM_TAG_ONLY: ${{ inputs.confirm_tag_only }}
        run: |
          set -euo pipefail
          tag="v2.0.0-rc.2"
          reviewed="e6c3ecce81010130ae28e7d1e37ea99b31d70c28"
          pr_head="31543e2e81ea635b4eaab87f606125b4e4dd22e1"
          hold() { echo "HOLD: RC2 exact reviewed owner-only tag requirements unmet" >&2; exit 2; }

          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || hold
          [[ "$GITHUB_REPOSITORY" == "aghajani82/Smite" ]] || hold
          [[ "$GITHUB_ACTOR" == "aghajani82" ]] || hold
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || hold
          [[ "$CONFIRM_TAG_ONLY" == "true" ]] || hold
          [[ "$EXPECTED_SOURCE_SHA" == "$reviewed" ]] || hold
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || hold
          [[ "$(git rev-parse "$reviewed^{commit}")" == "$reviewed" ]] || hold
          git merge-base --is-ancestor "$reviewed" HEAD || hold
          git diff --quiet "$pr_head^{tree}" "$reviewed^{tree}" || hold

          # Remote lookup must SUCCEED. Network/API failure cannot be
          # mistaken for an absent tag. No force and no mutable retagging.
          git ls-remote --tags origin > "$RUNNER_TEMP/smite-remote-tags" || hold
          if grep -Fq "refs/tags/$tag" "$RUNNER_TEMP/smite-remote-tags"; then
            hold
          fi
          [[ -z "$(git tag --list "$tag")" ]] || hold
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$reviewed" -m "Smite $tag signed-image trial candidate, PR #18 merge $reviewed; no deployment"
          git push origin "refs/tags/$tag:refs/tags/$tag" || hold
          git ls-remote --tags origin > "$RUNNER_TEMP/smite-remote-tags-after" || hold
          grep -Fq "refs/tags/$tag" "$RUNNER_TEMP/smite-remote-tags-after" || hold
          echo "TAG_ONLY_CREATED=$tag"
          echo "REVIEWED_SOURCE_COMMIT=$reviewed"
          echo "GHCR_IMAGES_PUBLISHED=NO"
          echo "GITHUB_RELEASE_CREATED=NO"
          echo "IR_KH_DEPLOYMENT=NO"

  # Owner-triggered immutable RC4 fix candidate; never publishes or deploys.
  lab-tag-only:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/smite-rc2-frp-singleton-multiport-20261025'
    needs: offline-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Create owner-approved RC4 immutable lab-only tag
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          CONFIRM_TAG_ONLY: ${{ inputs.confirm_tag_only }}
        run: |
          set -euo pipefail
          tag="v2.0.0-rc.4"
          original_rc3="ac67625c0fde00392a9142801b55ee61f296c86c"
          required_fix="8de0466e8463139fac2cd14748cd4a854b859393"
          reviewed_merge="4cbcdedd3c505ec342a9eba3a46a4f2ae08bef91"
          required_branch="refs/heads/feature/smite-rc2-frp-singleton-multiport-20261025"
          hold() { echo "HOLD: RC4 exact actor/ref/source/consent gate failed" >&2; exit 2; }

          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || hold
          [[ "$GITHUB_REPOSITORY" == "aghajani82/Smite" ]] || hold
          [[ "$GITHUB_ACTOR" == "aghajani82" ]] || hold
          [[ "$GITHUB_REF" == "$required_branch" ]] || hold
          [[ "$CONFIRM_TAG_ONLY" == "true" ]] || hold
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || hold
          [[ "$EXPECTED_SOURCE_SHA" == "$GITHUB_SHA" ]] || hold
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SOURCE_SHA" ]] || hold
          git merge-base --is-ancestor "$original_rc3" HEAD || hold
          git merge-base --is-ancestor "$required_fix" HEAD || hold
          git merge-base --is-ancestor "$reviewed_merge" HEAD || hold

          # Owner-reviewed branch tip must be current at tagging time.
          git ls-remote --heads origin > "$RUNNER_TEMP/rc4-remote-heads" || hold
          grep -Fxq "$(printf '%s\t%s' "$EXPECTED_SOURCE_SHA" "$required_branch")" "$RUNNER_TEMP/rc4-remote-heads" || hold

          # Tag lookup failures are HOLD, not permission to overwrite.
          git ls-remote --tags origin > "$RUNNER_TEMP/rc4-remote-tags" || hold
          if grep -Fq "refs/tags/$tag" "$RUNNER_TEMP/rc4-remote-tags"; then
            hold
          fi
          [[ -z "$(git tag --list "$tag")" ]] || hold
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$EXPECTED_SOURCE_SHA" \
            -m "Smite $tag Node graceful shutdown persistence fix; tag only"
          git push origin "refs/tags/$tag:refs/tags/$tag" || hold
          git ls-remote --tags origin > "$RUNNER_TEMP/rc4-remote-tags-after" || hold
          grep -Fq "refs/tags/$tag" "$RUNNER_TEMP/rc4-remote-tags-after" || hold
          echo "LAB_CANDIDATE_TAG_CREATED=$tag"
          echo "REVIEWED_SOURCE_COMMIT=$EXPECTED_SOURCE_SHA"
          echo "MAIN_MERGE=NO"
          echo "GHCR_PUSH=NO"
          echo "DEPLOYMENT=NO"

  # Owner-triggered immutable RC5 candidate tag; no publishing or deployment.
  rc5-tag-only:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/feature/smite-rc5-release-gate'
    needs: offline-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
          persist-credentials: true
      - name: Create owner-approved RC5 immutable lab-only tag
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          CONFIRM_TAG_ONLY: ${{ inputs.confirm_tag_only }}
        run: |
          set -euo pipefail
          tag="v2.0.0-rc.5"
          reviewed_source="be00b20d64051f5bbd5597701ebdbe60b33b481c"
          required_branch="refs/heads/feature/smite-rc5-release-gate"
          hold() { echo "HOLD: RC5 exact actor/ref/source/consent gate failed" >&2; exit 2; }

          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] || hold
          [[ "$GITHUB_REPOSITORY" == "aghajani82/Smite" ]] || hold
          [[ "$GITHUB_ACTOR" == "aghajani82" ]] || hold
          [[ "$GITHUB_REF" == "$required_branch" ]] || hold
          [[ "$CONFIRM_TAG_ONLY" == "true" ]] || hold
          [[ "$EXPECTED_SOURCE_SHA" == "$reviewed_source" ]] || hold
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] || hold
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]] || hold
          [[ "$(git rev-parse "$reviewed_source^{commit}")" == "$reviewed_source" ]] || hold
          git merge-base --is-ancestor "$reviewed_source" HEAD || hold

          # The release gate branch must still point to this reviewed workflow commit.
          git ls-remote --heads origin > "$RUNNER_TEMP/rc5-remote-heads" || hold
          grep -Fxq "$(printf '%s\t%s' "$GITHUB_SHA" "refs/heads/feature/smite-rc5-release-gate")" "$RUNNER_TEMP/rc5-remote-heads" || hold

          # Failed lookups and existing refs both stop the run. Never force or retag.
          git ls-remote --tags origin > "$RUNNER_TEMP/rc5-remote-tags" || hold
          if grep -Fq "refs/tags/$tag" "$RUNNER_TEMP/rc5-remote-tags"; then
            hold
          fi
          [[ -z "$(git tag --list "$tag")" ]] || hold
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" "$reviewed_source" -m "Smite $tag signed-image trial candidate at reviewed source $reviewed_source; tag only"
          git push origin "refs/tags/$tag:refs/tags/$tag" || hold
          git ls-remote --tags origin "refs/tags/$tag" "refs/tags/$tag^{}" > "$RUNNER_TEMP/rc5-remote-tags-after" || hold
          grep -Fq "refs/tags/$tag^{}" "$RUNNER_TEMP/rc5-remote-tags-after" || hold
          [[ "$(awk -v ref="refs/tags/$tag^{}" '$2 == ref {print $1}' "$RUNNER_TEMP/rc5-remote-tags-after")" == "$reviewed_source" ]] || hold
          echo "LAB_CANDIDATE_TAG_CREATED=$tag"
          echo "REVIEWED_SOURCE_COMMIT=$reviewed_source"
          echo "MAIN_MERGE=NO"
          echo "GHCR_PUSH=NO"
          echo "DEPLOYMENT=NO"
