name: Panel Signed NodeClient Stage Six

on:
  push:
    branches:
      - feature/smite-panel-nodeclient-hmac-stage6-20261018
      - feature/smite-foreign-signed-gateway-prefix-20261023
  pull_request:
    paths:
      - 'panel/app/signed_agent_transport.py'
      - 'panel/app/node_client.py'
      - 'panel/app/engine_admission.py'
      - 'panel/app/routers/tunnels.py'
      - 'tests/test_engine_pair_admission.py'
      - 'panel/app/config.py'
      - 'tests/test_panel_signed_nodeclient.py'
      - '.github/workflows/panel-signed-nodeclient.yml'

permissions:
  contents: read

jobs:
  signed-panel-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install 'httpx==0.25.2' 'fastapi==0.104.1' 'pydantic==2.5.0' 'pydantic-settings==2.1.0' 'cryptography==41.0.7' 'sqlalchemy==2.0.23' 'aiosqlite==0.19.0'
      - name: Check syntax
        run: python -m py_compile panel/app/signed_agent_transport.py panel/app/node_client.py panel/app/config.py panel/app/engine_admission.py panel/app/routers/tunnels.py tests/test_panel_signed_nodeclient.py tests/test_engine_pair_admission.py
      - name: Test Panel to Node signed transport and independent engines
        run: |
          python -B tests/test_panel_signed_nodeclient.py -v
          python -B tests/test_engine_pair_admission.py -v
