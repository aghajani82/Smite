name: Unified Smite Signed Trial Digest Pair (no deployment)

on:
  push:
    branches: [trial/unified-smite-install]
    paths:
      - '.github/workflows/unified-install-signed-trial.yml'
      - 'scripts/unified-trial-sign-image.sh'
      - 'scripts/create-unified-trial-pair.py'
      - 'tests/test_unified_trial_publication.py'
      - 'tests/test_foreign_install_migration.py'
      - 'tests/test_retained_backhaul_panel_upgrade.py'
      - 'panel/**'
      - 'node/**'
      - 'frontend/**'

permissions:
  contents: read

concurrency:
  group: unified-smite-signed-trial
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'aghajani82/Smite' && github.ref == 'refs/heads/trial/unified-smite-install' && github.event_name == 'push' && github.actor == 'aghajani82'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require exact branch checkout and signed-trial scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "aghajani82/Smite"
          test "$GITHUB_ACTOR" = "aghajani82"
          test "$GITHUB_EVENT_NAME" = "push"
          test "$GITHUB_REF" = "refs/heads/trial/unified-smite-install"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash -n scripts/unified-trial-sign-image.sh
          python3 -m py_compile scripts/create-unified-trial-pair.py tests/test_unified_trial_publication.py
          python3 -B tests/test_unified_trial_publication.py -v
      - name: Install pinned Panel dependencies and run Foreign admission checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r panel/requirements.txt
          python3 -B tests/test_foreign_install_migration.py -v
          python3 -B tests/test_foreign_install_http.py -v
          python3 -B tests/test_foreign_install_recovery.py -v
          python3 -B tests/test_foreign_install_origins.py -v
      - uses: actions/checkout@v4
        with:
          ref: e7f76185e9a7da51d7069d5d0a829dc192cc1e06
          path: retained-rc9
          persist-credentials: false
      - name: Verify Panel upgrade with retained RC9 tunnels and Node
        shell: bash
        env:
          DB_PATH: ${{ runner.temp }}/retained-backhaul-fixture.sqlite3
          SMITE_PANEL_AGENT_AUTH_MODE: signed
          SMITE_ENGINE_MANAGEMENT_MODE: managed
        run: |
          set -euo pipefail
          test "$(git -C retained-rc9 rev-parse HEAD)" = e7f76185e9a7da51d7069d5d0a829dc192cc1e06
          # Manager constructors use the image's fixed /app/data directory.
          sudo install -d -o "$(id -u)" -g "$(id -g)" /app/data
          PYTHONPATH="$PWD/retained-rc9/panel" python3 -B tests/test_retained_backhaul_panel_upgrade.py prepare
          PYTHONPATH="$PWD/panel" python3 -B tests/test_retained_backhaul_panel_upgrade.py candidate
          PYTHONPATH="$PWD/retained-rc9/panel" python3 -B tests/test_retained_backhaul_panel_upgrade.py rollback
          mkdir -p "$RUNNER_TEMP/mixed-smite/tests"
          ln -s "$PWD/panel" "$RUNNER_TEMP/mixed-smite/panel"
          ln -s "$PWD/retained-rc9/node" "$RUNNER_TEMP/mixed-smite/node"
          for test_file in test_stage11_backhaul_frp_interop.py test_node_agent_signed_commands.py test_managed_engine_restart.py; do
            cp "tests/$test_file" "$RUNNER_TEMP/mixed-smite/tests/$test_file"
            python3 -B "$RUNNER_TEMP/mixed-smite/tests/$test_file" -v
          done
      - name: Verify that live activation is not authorized
        run: echo NO_DEPLOYMENT_OR_RELEASE=YES

  build-panel:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.pushed-panel.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Panel by digest ONLY (no tags)
        uses: docker/build-push-action@v6
        id: pushed-panel
        with:
          context: .
          file: panel/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/aghajani82/smite-panel,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SMITE_VERSION=2.0.0-unified-install-trial
            SMITE_SOURCE_SHA=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Sign and verify exact Panel digest (trial branch identity)
        shell: bash
        env:
          SMITE_IMAGE_ROLE: panel
          SMITE_IMAGE_DIGEST: ${{ steps.pushed-panel.outputs.digest }}
        run: bash scripts/unified-trial-sign-image.sh

  build-node:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.pushed-node.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify immutable source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Node by digest ONLY (no tags)
        uses: docker/build-push-action@v6
        id: pushed-node
        with:
          context: ./node
          file: ./node/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=ghcr.io/aghajani82/smite-node,push-by-digest=true,name-canonical=true,push=true
          build-args: |
            SMITE_VERSION=2.0.0-unified-install-trial
            SMITE_SOURCE_SHA=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Sign and verify exact Node digest (trial branch identity)
        shell: bash
        env:
          SMITE_IMAGE_ROLE: node
          SMITE_IMAGE_DIGEST: ${{ steps.pushed-node.outputs.digest }}
        run: bash scripts/unified-trial-sign-image.sh

  trial-pair-handoff:
    needs: [preflight, build-panel, build-node]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: 'v3.0.6'
      - name: Rehearse retained database upgrade and rollback with signed Panel images
        shell: bash
        env:
          CANDIDATE_DIGEST: ${{ needs.build-panel.outputs.digest }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          old_sha=e7f76185e9a7da51d7069d5d0a829dc192cc1e06
          registry=ghcr.io/aghajani82/smite-panel
          old_panel="$registry@sha256:f6999effd131f6b3272f8d9116b3fbae917f699bf9a29271fc5ede24cc387a2e"
          new_panel="$registry@$CANDIDATE_DIGEST"
          identity_prefix=https://github.com/aghajani82/Smite/.github/workflows
          verify_panel() {
            local image="$1" source="$2" identity="$3" trigger="$4"
            shift 4
            cosign verify --certificate-identity="$identity" \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --certificate-github-workflow-repository=aghajani82/Smite \
              --certificate-github-workflow-sha="$source" \
              --certificate-github-workflow-trigger="$trigger" \
              -a smite_role=panel -a "smite_source_sha=$source" "$@" "$image" >/dev/null
            docker pull "$image"
            test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$source"
          }
          verify_panel "$old_panel" "$old_sha" "$identity_prefix/publish-images.yml@refs/tags/v2.0.0-rc.9" workflow_dispatch
          verify_panel "$new_panel" "$GITHUB_SHA" "$identity_prefix/unified-install-signed-trial.yml@$GITHUB_REF" push -a smite_trial=unified-install
          data=$(mktemp -d)
          fixture="$PWD/tests/test_retained_backhaul_panel_upgrade.py"
          check_panel() {
            docker run --rm --pull=never --network=none \
              --mount "type=bind,source=$data,target=/fixture-data" \
              --mount "type=bind,source=$fixture,target=/check-retained-panel.py,readonly" \
              -e DB_PATH=/fixture-data/retained-backhaul-fixture.sqlite3 \
              -e SMITE_PANEL_AGENT_AUTH_MODE=signed -e SMITE_ENGINE_MANAGEMENT_MODE=managed \
              -e PYTHONPATH=/app --entrypoint python3 "$1" -B /check-retained-panel.py "$2"
          }
          check_panel "$old_panel" prepare
          check_panel "$new_panel" candidate
          check_panel "$old_panel" rollback
          echo RETAINED_PANEL_SIGNED_IMAGE_DATABASE_REHEARSAL=PASS
      - name: Emit inert exact-SHA digest pair only after BOTH signed jobs
        shell: bash
        env:
          PANEL_DIGEST: ${{ needs.build-panel.outputs.digest }}
          NODE_DIGEST: ${{ needs.build-node.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          PUBLISH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          mkdir -p "$RUNNER_TEMP/unified-trial"
          python3 -B scripts/create-unified-trial-pair.py \
            --source-sha "$SOURCE_SHA" \
            --publish-ref "$PUBLISH_REF" \
            --panel-digest "$PANEL_DIGEST" \
            --node-digest "$NODE_DIGEST" \
            --output "$RUNNER_TEMP/unified-trial/registry-pair.json"
          sha256sum "$RUNNER_TEMP/unified-trial/registry-pair.json"
          echo NO_DEPLOYMENT_OR_RELEASE=YES
      - uses: actions/upload-artifact@v4
        with:
          name: smite-unified-install-trial-pair-${{ github.sha }}
          path: ${{ runner.temp }}/unified-trial/registry-pair.json
          retention-days: 7
          if-no-files-found: error
