name: Publish Experimental FRP 443 Images

# This workflow ONLY publishes commit-specific experimental images from the
# dedicated feature branch. It never deploys, replaces latest or touches main.
on:
  push:
    branches:
      - feature/frp-tls-sni-443
    paths:
      - 'node/**'
      - 'panel/**'
      - 'frontend/**'
      - 'tests/**'
      - '.github/workflows/frp443-experimental-publish.yml'

permissions:
  contents: read

concurrency:
  group: publish-frp443-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate experimental FRP gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and test the modified application files
        run: |
          python3 -m compileall -q node/app/frp_gateway_config.py node/app/core_adapters.py panel/app/routers/tunnels.py
          python3 -m unittest discover -s tests -p 'test_frp_gateway.py' -v

  build-and-publish:
    name: Publish ${{ matrix.service }} (commit tag only)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: node
            context: ./node
            dockerfile: ./node/Dockerfile
            image: smite-node
          - service: panel
            context: .
            dockerfile: ./panel/Dockerfile
            image: smite-panel
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push strictly versioned experimental image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/aghajani82/${{ matrix.image }}:frp443-${{ github.sha }}
          build-args: |
            SMITE_VERSION=0.1.7-frp443-test
          labels: |
            org.opencontainers.image.source=https://github.com/aghajani82/Smite
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frp443-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=frp443-${{ matrix.service }}
