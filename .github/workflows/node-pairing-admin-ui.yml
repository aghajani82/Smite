name: Smite Node Pairing Admin UI

on:
  pull_request:
    paths:
      - 'frontend/src/components/NodePairingAction.tsx'
      - 'frontend/src/pages/Nodes.tsx'
      - 'frontend/src/pages/Servers.tsx'
      - 'panel/app/routers/node_pairing.py'
      - 'frontend/tsconfig.pairing.json'
      - 'tests/test_node_pairing_http.py'
      - 'tests/test_node_pairing_admin_ui.py'
      - '.github/workflows/node-pairing-admin-ui.yml'
  push:
    branches:
      - feature/node-pairing-admin-ui-20261018

permissions:
  contents: read

jobs:
  frontend-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Check new Pairing React component with strict TypeScript
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.pairing.json
      - name: Build frontend assets
        working-directory: frontend
        run: npm run build

  api-capabilities-and-ui-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact API dependencies
        run: |
          python -m pip install \
            'fastapi==0.104.1' 'httpx==0.25.2' \
            'pydantic==2.5.0' 'pydantic-settings==2.1.0' \
            'cryptography==41.0.7' 'sqlalchemy==2.0.23' 'aiosqlite==0.19.0' \
            'passlib[bcrypt]==1.7.4' 'bcrypt==4.0.1' \
            'python-jose[cryptography]==3.3.0'
      - name: Test authenticated capabilities and staged enrollment
        run: python -B tests/test_node_pairing_http.py -v
      - name: Check UI security invariants
        run: python -B tests/test_node_pairing_admin_ui.py -v
