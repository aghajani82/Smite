name: Node Pairing Atomic Store

on:
  pull_request:
    paths:
      - 'panel/app/node_pairing_store.py'
      - 'panel/app/foreign_install_grants.py'
      - 'panel/app/signed_node_origins.py'
      - 'panel/app/signed_agent_transport.py'
      - 'panel/app/node_client.py'
      - 'panel/app/signed_node_registration.py'
      - 'panel/app/routers/signed_nodes.py'
      - 'tests/test_foreign_install_recovery.py'
      - 'tests/test_foreign_install_origins.py'
      - 'tests/test_foreign_install_grants.py'
      - 'panel/app/routers/foreign_install.py'
      - 'panel/app/config.py'
      - 'panel/main.py'
      - 'panel/requirements.txt'
      - 'tests/test_foreign_install_http.py'
      - 'tests/test_node_pairing_store.py'
      - 'panel/app/recovery_snapshot_admission.py'
      - 'tests/test_recovery_snapshot_admission.py'
      - 'docs/node-pairing-stage2.md'
      - '.github/workflows/node-pairing-stage2.yml'
  push:
    branches:
      - feature/node-pairing-transactional-store-20261018
      - trial/unified-smite-install

permissions:
  contents: read

jobs:
  pairing-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned crypto dependency
        run: python -m pip install 'cryptography==41.0.7'
      - name: Compile source and tests
        run: python -m py_compile panel/app/node_pairing_store.py tests/test_node_pairing_store.py panel/app/recovery_snapshot_admission.py tests/test_recovery_snapshot_admission.py
      - name: Execute inert SQLite pairing and replay tests
        run: |
          python -B tests/test_node_pairing_store.py -v
          python -B tests/test_foreign_install_grants.py -v
          python -B tests/test_recovery_snapshot_admission.py -v

  foreign-install-http:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Panel dependencies
        run: python -m pip install -r panel/requirements.txt
      - name: Trial HTTP authorization and existing enrollment regressions
        run: |
          python -B tests/test_foreign_install_recovery.py -v
          python -B tests/test_foreign_install_origins.py -v
          python -B tests/test_panel_signed_nodeclient.py -v
          python -B tests/test_stage12_signed_origins_and_updates.py -v
          python -B tests/test_signed_node_inbound_panel.py -v
          python -B tests/test_foreign_install_http.py -v
          python -B tests/test_node_pairing_http.py -v
          python -B tests/test_totp_mfa.py -v
