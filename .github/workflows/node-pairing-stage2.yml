name: Node Pairing Atomic Store

on:
  pull_request:
    paths:
      - 'panel/app/node_pairing_store.py'
      - 'tests/test_node_pairing_store.py'
      - 'docs/node-pairing-stage2.md'
      - '.github/workflows/node-pairing-stage2.yml'
  push:
    branches:
      - feature/node-pairing-transactional-store-20261018

permissions:
  contents: read

jobs:
  pairing-store:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned crypto dependency
        run: python -m pip install 'cryptography==41.0.7'
      - name: Compile source and tests
        run: python -m py_compile panel/app/node_pairing_store.py tests/test_node_pairing_store.py
      - name: Execute inert SQLite pairing and replay tests
        run: python -B tests/test_node_pairing_store.py -v
