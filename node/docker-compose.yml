# Smite Node - Docker Compose Configuration
# Usage: cd node && docker compose up -d

services:
  smite-node:
    image: ghcr.io/zzedix/smite-node:${SMITE_VERSION:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smite-node
    # U-OPTI provisions this dedicated host GID for the read-only broker socket.
    # Keep the Node adapter's required UID 0; the broker checks the exact UID/GID.
    user: "0:${SMITE_UOPTI_BROKER_GID:-0}"
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./certs:/etc/smite-node/certs:ro
      - ./config:/etc/smite-node
      - node-data:/var/lib/smite-node
      # Read-only directory mount exposes only the broker Unix socket when U-OPTI provisions it.
      - /run/u-opti/smite:/run/u-opti/smite:ro
      # KH-only opt-in: U-OPTI validates the host DB before setting this path.
      # /dev/null keeps IR/default installs inactive without creating a host path.
      - ${SMITE_SANAEI_DB_HOST_PATH:-/var/lib/u-opti/smite-sanaei-empty}:/run/smite-sanaei-ro:ro
    env_file:
      - .env
    environment:
      - NODE_API_PORT=${NODE_API_PORT:-8888}
      - NODE_NAME=${NODE_NAME:-node-1}
      - PANEL_CA_PATH=${PANEL_CA_PATH:-/etc/smite-node/certs/ca.crt}
      - PANEL_ADDRESS=${PANEL_ADDRESS}
      - PANEL_API_PORT=${PANEL_API_PORT:-8000}
      - SMITE_SANAEI_INVENTORY_ENABLED=${SMITE_SANAEI_INVENTORY_ENABLED:-false}
      - SMITE_SANAEI_DB_PATH=/run/smite-sanaei-ro/x-ui.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${NODE_API_PORT:-8888}/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Security: Drop all capabilities except those needed
    security_opt:
      - no-new-privileges:true

volumes:
  node-data:
    driver: local
    name: smite-node-data
